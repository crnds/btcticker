name: Update CDC data

on:
  schedule:
    # 00:05 UTC daily, just after the Kraken daily candle closes; scheduled
    # runs typically start a few hours late, so the newest block reflects the
    # in-progress day
    - cron: '5 0 * * *'
  workflow_dispatch:       # allow manual runs from GitHub UI

permissions:
  contents: write

# update-cdc.yml and update-fng.yml declare the SAME group on purpose: their
# crons are 5 minutes apart, both push to main, and GitHub's scheduler lag is
# routinely hours, so overlap is normal rather than exotic. Queue instead of
# cancelling — a cancelled run silently drops a data point, which is the
# failure this exists to prevent.
concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  update-cdc:
    runs-on: ubuntu-latest
    steps:
      # actions pinned to commit SHAs — this workflow has contents:write
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Fetch CDC data
        run: python3 fetch_cdc.py

      - name: Commit updated CDC data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cdc.js
          if git diff --cached --quiet; then
            echo "No change — nothing to commit"
            exit 0
          fi
          git commit -m "chore: update CDC data $(date -u +%Y-%m-%d)"
          # concurrency: data-commit makes an overlap unlikely, but a push can
          # still lose to something else landing on main mid-run. Rebase and
          # retry; our commit only touches data/cdc.js, so a real conflict
          # isn't reachable in practice — update-fng.yml writes a different file.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt) — rebasing onto origin/main"
            git pull --rebase origin main
          done
          echo "::error::could not push data/cdc.js after 3 attempts"
          exit 1
