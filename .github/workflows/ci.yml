name: CI

on:
  push:
    branches: [main]
    # excluded on purpose: update-cdc.yml/update-fng.yml commit here ~3x/day
    # and none of it can affect the Python tests or the version-consistency
    # check below — without this, every bot data commit burns a CI run
    paths-ignore: ['data/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read   # deliberately narrower than the data-refresh workflows

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Run tests
        run: python3 -m unittest discover -s tests -t . -v

  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # package.json / package-lock.json (two sites) / build.gradle drifted
      # out of sync before (v1.11.0 vs v1.11.1 vs a stale README link) because
      # nothing enforced them agreeing — this is that enforcement.
      - name: Check version numbers agree
        run: |
          set -euo pipefail
          pkg=$(node -p "require('./package.json').version")
          lock_root=$(node -p "require('./package-lock.json').version")
          lock_pkg=$(node -p "require('./package-lock.json').packages[''].version")
          gradle=$(grep -oE 'versionName "[^"]+"' android/app/build.gradle | head -1 | cut -d'"' -f2)
          echo "package.json=$pkg  package-lock.json(root)=$lock_root  package-lock.json(packages'')=$lock_pkg  build.gradle versionName=$gradle"
          fail=0
          [ "$pkg" = "$lock_root" ] || { echo "::error file=package-lock.json,line=3::root version $lock_root does not match package.json $pkg"; fail=1; }
          [ "$pkg" = "$lock_pkg"  ] || { echo "::error file=package-lock.json,line=9::packages[''] version $lock_pkg does not match package.json $pkg"; fail=1; }
          [ "$pkg" = "$gradle"    ] || { echo "::error file=android/app/build.gradle,line=19::versionName $gradle does not match package.json $pkg"; fail=1; }
          exit $fail
